[project]
name = "forx-research"
version = "0.1.0"
description = "Python vrstva pro Forx — export Parquetu a kontraktní testy schématu"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
